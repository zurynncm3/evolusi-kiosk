<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EVOLUSI COE 2025</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    loop
    preload="auto">
    
    <source src="evolusi.mp4" type="video/mp4">

</video>

<script>
const video = document.getElementById("video");

video.muted = true;

video.play().catch(function() {
    console.log("Autoplay blocked");
});
</script>

</body>
</html>
