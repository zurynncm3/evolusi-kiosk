<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PKG Chenderong Balai</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<video
    id="player"
    autoplay
    playsinline
    preload="auto">
</video>

<script>

const videos = [
    "evolusi25.mp4",
    "evolusi24.mp4",
];

let currentVideo = 0;

const player = document.getElementById("player");

function playVideo() {

    player.src = videos[currentVideo];

    player.load();

    player.play().catch(function(error) {
        console.log("Autoplay:", error);
    });
}

player.addEventListener("ended", function() {

    currentVideo++;

    if (currentVideo >= videos.length) {
        currentVideo = 0;
    }

    playVideo();

});

playVideo();

</script>

</body>
</html>
